<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Office Asset & Purchase Expense</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f4f7fb;
    color:#1e293b;
    line-height:1.5;
}

/* ================= HEADER ================= */

.header{
    background:linear-gradient(135deg,#111827,#1e3a8a);
    color:white;
    padding:45px 20px;
    text-align:center;
}

.header h1{
    font-size:clamp(25px,4vw,42px);
    margin-bottom:10px;
}

.header p{
    opacity:.85;
    font-size:16px;
}

.total-box{
    max-width:1100px;
    margin:-25px auto 30px;
    background:white;
    border-radius:18px;
    padding:25px;
    box-shadow:0 12px 35px rgba(0,0,0,.10);
    text-align:center;
    position:relative;
}

.total-box small{
    color:#64748b;
    display:block;
    margin-bottom:5px;
}

.total{
    font-size:clamp(30px,5vw,48px);
    font-weight:800;
    color:#0f766e;
}

/* ================= CONTROL ================= */

.controls{
    max-width:1100px;
    margin:0 auto 30px;
    padding:0 15px;
    display:flex;
    gap:12px;
    flex-wrap:wrap;
}

.search{
    flex:1;
    min-width:220px;
    padding:14px 18px;
    border:1px solid #dbe3ee;
    border-radius:12px;
    outline:none;
    font-size:15px;
    background:white;
}

.search:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,.10);
}

.filter{
    padding:14px 18px;
    border:1px solid #dbe3ee;
    border-radius:12px;
    background:white;
    outline:none;
    cursor:pointer;
    font-size:15px;
}

/* ================= CONTAINER ================= */

.container{
    max-width:1100px;
    margin:auto;
    padding:0 15px 60px;
}

.category{
    margin-bottom:35px;
}

.category-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:15px;
    padding-bottom:10px;
    border-bottom:2px solid #e2e8f0;
}

.category-title{
    font-size:23px;
    font-weight:800;
    color:#0f172a;
}

.category-total{
    background:#e0f2fe;
    color:#0369a1;
    padding:7px 13px;
    border-radius:20px;
    font-size:13px;
    font-weight:bold;
    white-space:nowrap;
}

/* ================= ITEMS ================= */

.items{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:13px;
}

.item{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:13px;
    padding:16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    transition:.25s;
}

.item:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 25px rgba(0,0,0,.08);
    border-color:#bfdbfe;
}

.item-name{
    color:#2563eb;
    font-weight:700;
    cursor:pointer;
    text-decoration:underline;
    text-decoration-style:dotted;
    text-underline-offset:4px;
}

.item-name:hover{
    color:#1d4ed8;
}

.item-price{
    font-weight:800;
    color:#111827;
    white-space:nowrap;
}

/* ================= NO RESULT ================= */

.no-result{
    display:none;
    text-align:center;
    padding:50px 20px;
    color:#64748b;
}

/* ================= MODAL ================= */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.78);
    z-index:9999;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-content{
    background:white;
    width:min(750px,100%);
    max-height:90vh;
    border-radius:20px;
    overflow:hidden;
    position:relative;
    animation:zoom .25s ease;
}

@keyframes zoom{
    from{
        transform:scale(.85);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

.modal-image{
    width:100%;
    height:450px;
    object-fit:cover;
    display:block;
    background:#e2e8f0;
}

.modal-info{
    padding:20px;
    text-align:center;
}

.modal-info h2{
    margin-bottom:5px;
    font-size:24px;
}

.modal-info p{
    color:#0f766e;
    font-size:20px;
    font-weight:800;
}

.close{
    position:absolute;
    right:15px;
    top:15px;
    width:42px;
    height:42px;
    border:0;
    border-radius:50%;
    background:rgba(0,0,0,.65);
    color:white;
    font-size:25px;
    cursor:pointer;
    z-index:5;
}

.close:hover{
    background:#dc2626;
}

/* ================= FOOTER ================= */

.footer{
    text-align:center;
    padding:25px;
    background:#111827;
    color:#94a3b8;
    font-size:14px;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

    .header{
        padding:32px 15px;
    }

    .total-box{
        margin: -15px 15px 25px;
    }

    .category-header{
        align-items:flex-start;
        flex-direction:column;
    }

    .category-total{
        font-size:12px;
    }

    .items{
        grid-template-columns:1fr;
    }

    .item{
        padding:14px;
    }

    .modal-image{
        height:300px;
    }
}
</style>

/* =========================================================
   FORMAT MONEY
========================================================= */

function money(number){

    return new Intl.NumberFormat("en-BD").format(number);

}


/* =========================================================
   GET CATEGORIES
========================================================= */

const categories = [...new Set(
    expenses.map(item => item.category)
)];


/* =========================================================
   CREATE FILTER
========================================================= */

const filter = document.getElementById("filter");

categories.forEach(category => {

    const option = document.createElement("option");

    option.value = category;
    option.textContent = category;

    filter.appendChild(option);

});


/* =========================================================
   RENDER
========================================================= */

function render(){

    const container =
        document.getElementById("expenseContainer");

    const search =
        document.getElementById("search")
        .value
        .toLowerCase()
        .trim();

    const selected =
        filter.value;

    container.innerHTML = "";

    let found = false;


    categories.forEach(category => {

        if(
            selected !== "all" &&
            selected !== category
        ){
            return;
        }


        const categoryItems =
            expenses.filter(item => {

                const matchesCategory =
                    item.category === category;

                const matchesSearch =
                    item.name
                    .toLowerCase()
                    .includes(search);

                return matchesCategory &&
                       matchesSearch;

            });


        if(categoryItems.length === 0){
            return;
        }


        found = true;


        /* CATEGORY TOTAL */

        const categoryTotal =
            categoryItems.reduce(
                (sum,item) => sum + item.price,
                0
            );


        /* SECTION */

        const section =
            document.createElement("section");

        section.className = "category";


        section.innerHTML = `

            <div class="category-header">

                <div class="category-title">
                    ${category}
                </div>

                <div class="category-total">
                    ${categoryItems.length} Items
                    • ৳ ${money(categoryTotal)}
                </div>

            </div>

            <div class="items"></div>

        `;


        const itemsContainer =
            section.querySelector(".items");


        /* ITEMS */

        categoryItems.forEach(item => {

            const card =
                document.createElement("div");

            card.className = "item";


            card.innerHTML = `

                <div
                    class="item-name"
                    onclick='openImage(
                        ${JSON.stringify(item.name)},
                        ${item.price},
                        ${JSON.stringify(item.image)}
                    )'
                >
                    ${item.name}
                </div>

                <div class="item-price">
                    ৳ ${money(item.price)}
                </div>

            `;


            itemsContainer.appendChild(card);

        });


        container.appendChild(section);

    });


    document.getElementById("noResult").style.display =
        found ? "none" : "block";

}


/* =========================================================
   IMAGE MODAL
========================================================= */

function openImage(name, price, image){

    const modal =
        document.getElementById("imageModal");

    const img =
        document.getElementById("modalImage");

    document.getElementById("modalTitle")
        .textContent = name;

    document.getElementById("modalPrice")
        .textContent = "৳ " + money(price);


    img.src = image;

    img.alt = name;


    /*
       If external image fails,
       show a generated fallback image.
    */

    img.onerror = function(){

        this.onerror = null;

        this.src =
        "https://placehold.co/1000x650/e2e8f0/334155?text="
        + encodeURIComponent(name);

    };


    modal.classList.add("show");

}


/* =========================================================
   CLOSE MODAL
========================================================= */

function closeModal(){

    document
        .getElementById("imageModal")
        .classList.remove("show");

}


/* =========================================================
   CLICK OUTSIDE MODAL
========================================================= */

document
    .getElementById("imageModal")
    .addEventListener(
        "click",
        function(e){

            if(e.target === this){
                closeModal();
            }

        }
    );


/* =========================================================
   ESC KEY
========================================================= */

document.addEventListener(
    "keydown",
    function(e){

        if(e.key === "Escape"){
            closeModal();
        }

    }
);


/* =========================================================
   SEARCH
========================================================= */

document
    .getElementById("search")
    .addEventListener(
        "input",
        render
    );


/* =========================================================
   FILTER
========================================================= */

filter.addEventListener(
    "change",
    render
);


/* =========================================================
   INITIAL LOAD
========================================================= */

render();
